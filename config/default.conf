# Config par défaut de webserv : utilisée quand aucun fichier n'est
# passé en argument. Les chemins pointent sur le dossier www/ du repo
# pour que la démo fonctionne sans rien installer.

server {
    listen 8080;
    host 127.0.0.1;
    server_name webserv.com;
    client_max_body_size 1m;
    error_page 404 www/errors/404.html;

    location / {
        root www;
        index index.html;
        methods GET POST;
        autoindex off;
    }

    location /uploads {
        root www/uploads;
        methods GET POST DELETE;
        upload_store www/uploads;
        autoindex on;
    }

    location /cgi-bin {
        root www;
        methods GET POST;
        cgi_extensions .py /usr/bin/python3;
    }

    location /old {
        redirect http://127.0.0.1:8080/;
    }
}
