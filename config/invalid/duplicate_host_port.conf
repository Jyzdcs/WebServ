# ERREUR ATTENDUE (sémantique) : deux servers sur le même host:port
# SANS server_name pour les départager -> refus de démarrer (sujet, éval §6).
# NB : avec des server_name différents ce serait accepté (virtual hosting,
# voir config/valid/virtual_hosts.conf).

server {
    listen 8080;
    host 127.0.0.1;

    location / {
        root www;
        methods GET;
    }
}

