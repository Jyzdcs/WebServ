# ERREUR ATTENDUE (sémantique) : même host:port ET même server_name.
# Contrairement à virtual_hosts.conf (noms différents = OK), ici rien
# ne permet de départager les deux servers -> refus de démarrer.

server {
    listen 8080;
    host 127.0.0.1;
    server_name site.com;

    location / {
        root www;
        methods GET;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name site.com;

    location / {
        root www/uploads;
        methods GET;
    }
}
