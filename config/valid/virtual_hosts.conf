server {
    listen 8080;
    host 127.0.0.1;
    server_name site-a.com;

    location / {
        root www;
        index index.html;
        methods GET;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name site-b.com;

    location / {
        root www;
        methods GET;
        autoindex on;
    }
}
