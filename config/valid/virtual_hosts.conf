# Virtual hosting par nom : deux servers sur le MÊME host:port,
# départagés par leur server_name via le header Host de la requête.
# Scénario de la grille d'éval :
#   curl --resolve site-a.com:8080:127.0.0.1 http://site-a.com:8080/
#   curl --resolve site-b.com:8080:127.0.0.1 http://site-b.com:8080/

server {
    listen 8080;
    host 127.0.0.1;
    server_name site-a.com;

    location / {
        root www;
        index index.html;
        methods GET;
    }
}

server {
    listen 8080;
    host 127.0.0.1;
    server_name site-b.com;

    location / {
        root www;
        methods GET;
        autoindex on;
    }
}
