# Plusieurs servers sur des host:port différents (exigence du sujet).
# Cas piège couvert : le même port 9090 sur deux hosts différents
# est AUTORISÉ (c'est le couple host:port qui doit être unique).

server {
    listen 8080;
    host 127.0.0.1;
    server_name site-un.com;

    location / {
        root www;
        index index.html;
        methods GET;
    }
}

server {
    listen 9090;
    host 127.0.0.1;
    server_name site-deux.com;

    location / {
        root www;
        methods GET POST;
        autoindex on;
    }
}

server {
    listen 9090;
    host 0.0.0.0;
    server_name site-trois.com;

    location / {
        root www;
        methods GET;
    }
}
