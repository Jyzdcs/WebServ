# Config orientée CGI : exécution de scripts Python via /cgi-bin,
# avec upload pour tester les POST vers un script.

server {
    listen 8082;
    host 127.0.0.1;
    server_name cgi-demo.com;
    client_max_body_size 2m;
    error_page 404 www/errors/404.html;
    error_page 500 www/errors/404.html;

    location / {
        root www;
        index index.html;
        methods GET;
    }

    location /cgi-bin {
        root www;
        methods GET POST;
        cgi_extensions .py /usr/bin/python3;
    }

    location /uploads {
        root www/uploads;
        methods POST;
        upload_store www/uploads;
    }
}
