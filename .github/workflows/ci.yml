name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run unit tests (C++)
        run: |
          failed=0
          for f in $(find tests/ -name "*.cpp" | sort); do
            echo "--- Compiling $f ---"
            bin=$(mktemp /tmp/test_XXXXXX)
            c++ -Wall -Wextra -Werror -std=c++98 -I include "$f" \
              $(find src/ -name "*.cpp" ! -name "ConfigMock.cpp") \
              -o "$bin" || { failed=1; continue; }
            echo "--- Running $f ---"
            "$bin" || failed=1
          done
          exit $failed

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y siege python3

      - name: Run e2e tests
        run: |
          chmod +x tests/e2e/run_e2e.sh
          bash tests/e2e/run_e2e.sh
